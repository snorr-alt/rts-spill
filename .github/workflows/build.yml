name: Bygg APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bygg APK med Godot
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./ci/build_apk.sh

      - name: Last opp som release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(cat version.txt).${{ github.run_number }}"
          cp build/riket.apk "build/riket-$V.apk"
          gh release create "v$V" \
            "build/riket-$V.apk" \
            --title "Riket $V" \
            --notes "Automatisk bygget fra commit ${GITHUB_SHA::7}."

      - uses: actions/upload-artifact@v4
        with:
          name: riket-apk
          path: build/riket.apk
